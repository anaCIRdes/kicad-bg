name: Diagnose (apt + MSYS2-CMake)

on:
  push:
    branches: [diagnose]
  workflow_dispatch:

jobs:
  diag-linux:
    name: apt-Diagnose (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: apt-get update
        run: |
          sudo apt-get update 2>&1 | tee /tmp/aptupdate.log || {
            echo "::error::apt-get update FEHLGESCHLAGEN"
            grep -m 8 -E "^E:" /tmp/aptupdate.log | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-180 | tr ',' ';' | tr '%' '#')"
            done
            exit 1
          }

      - name: apt-get install (Liste aus build-kicad.yml)
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl file \
            libboost-all-dev libcurl4-openssl-dev libssl-dev \
            libgl1-mesa-dev libglew-dev libglm-dev libegl1-mesa-dev \
            libocct-data-exchange-dev libocct-draw-dev \
            libocct-foundation-dev libocct-modeling-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libcairo2-dev libpixman-1-dev \
            libwxgtk3.2-dev libwxgtk-gl3.2-gtk3-dev wx3.2-headers \
            python3-dev swig \
            libngspice-dev libspice-protocol-dev \
            nlohmann-json3-dev libgit2-dev libsecret-1-dev \
            libzstd-dev gettext pkg-config 2>&1 | tee /tmp/aptinstall.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -m 6 -E "^E:" /tmp/aptinstall.log | while IFS= read -r l; do
              echo "::error::Apt: $(echo "$l" | cut -c1-180 | tr ',' ';' | tr '%' '#')"
            done
            tail -4 /tmp/aptinstall.log | while IFS= read -r l; do
              echo "::error::Tail: $(echo "$l" | cut -c1-180 | tr ',' ';' | tr '%' '#')"
            done
            exit 1
          fi
          echo "::notice::apt-Liste komplett installierbar auf ubuntu-24.04"

  diag-windows:
    name: MSYS2-CMake-Diagnose (10.0.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: KiCad-Quelle mit Submodulen
        uses: actions/checkout@v4
        with:
          repository: KiCad/kicad-source-mirror
          ref: '10.0.8'
          path: kicad
          fetch-depth: 1
          submodules: recursive

      - name: MSYS2 (UCRT64) einrichten
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make tar
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-zstd

      - name: xSignals-Patch anwenden
        shell: msys2 {0}
        run: python3 scripts/apply_xsignals.py --src kicad

      - name: CMake konfigurieren (Fehler als Annotationen)
        shell: msys2 {0}
        run: |
          set +e
          cmake -S kicad -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/install > /tmp/cmake.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -m 6 -iE "error|not found|fatal|required" /tmp/cmake.log | while IFS= read -r l; do
              echo "::error::CMake: $(echo "$l" | cut -c1-170 | tr ',' ';' | tr '%' '#')"
            done
            tail -4 /tmp/cmake.log | while IFS= read -r l; do
              echo "::error::Tail: $(echo "$l" | cut -c1-170 | tr ',' ';' | tr '%' '#')"
            done
            exit 1
          fi
          echo "::notice::CMake-Konfiguration erfolgreich"

      - name: Umgebung ausgeben
        if: always()
        shell: msys2 {0}
        run: |
          echo "::notice::wx-config: $(wx-config --version 2>&1 | head -1 | tr ',' ';')"
          echo "::notice::python3: $(python3 --version 2>&1 | tr ',' ';')"
          ls /ucrt64/lib/libngspice* 2>/dev/null | head -2
          ls /ucrt64/lib/libTKernel* 2>/dev/null | head -1
