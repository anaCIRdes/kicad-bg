name: KiCad bauen (xSignals-Patch)

on:
  push:
    branches: [main]
    # Build nur starten, wenn sich Patch/Build-Teil geändert hat
    # (nicht bei reinen Plugin-/Doku-Änderungen)
    paths-ignore:
      - 'README.md'
      - 'ANLEITUNG.md'
      - 'LICENSE'
      - 'plugin/**'
      - 'pcm/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      kicad_tag:
        description: 'KiCad-Tag (z. B. 10.0.8) oder "latest" für die neueste stabile Version'
        required: false
        default: 'latest'
  schedule:
    # Montags 04:10 UTC: prüft automatisch, ob es ein neues KiCad gibt
    - cron: '10 4 * * 1'

permissions:
  contents: write

concurrency:
  group: build-kicad-xsignals
  cancel-in-progress: false

jobs:
  resolve:
    name: KiCad-Version ermitteln
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.exist.outputs.skip }}
    steps:
      - name: Tag bestimmen (latest = neueste stabile Version)
        id: tag
        run: |
          TAGS=$(git ls-remote --tags --refs \
                 https://github.com/KiCad/kicad-source-mirror.git \
                 | awk -F/ '{print $NF}' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                 | grep -vE '^[0-9]+\.99\.[0-9]+$' | sort -V)
          LATEST=$(echo "$TAGS" | tail -1)
          CHOSEN="${{ github.event.inputs.kicad_tag || 'latest' }}"
          [ "$CHOSEN" = "latest" ] && CHOSEN="$LATEST"
          [ -z "$CHOSEN" ] && { echo "Kein stabiler Tag gefunden"; exit 1; }
          echo "tag=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "Baue KiCad $CHOSEN (neueste stabile Version: $LATEST)"

      - name: Release bereits vorhanden?
        id: exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "kicad-xsignals-${{ steps.tag.outputs.tag }}" \
              -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release für ${{ steps.tag.outputs.tag }} existiert bereits - übersprungen."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  patch-check:
    name: Patch-Anker prüfen (${{ needs.resolve.outputs.tag }})
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Dieses Repository auschecken
        uses: actions/checkout@v4

      - name: KiCad-Quelle (ohne Submodule, nur für den Check)
        uses: actions/checkout@v4
        with:
          repository: KiCad/kicad-source-mirror
          ref: ${{ needs.resolve.outputs.tag }}
          path: kicad
          fetch-depth: 1

      - name: Anker-Check (schlägt in Sekunden fehl, wenn KiCad sich geändert hat)
        run: python3 scripts/apply_xsignals.py --src kicad --check

  build-linux:
    name: Linux-Build (${{ needs.resolve.outputs.tag }})
    needs: [resolve, patch-check]
    if: needs.resolve.outputs.skip == 'false'
    # ubuntu-24.04 gepinnt: die apt-Paketliste (wx3.2, OCCT, GTK3/Poppler/Wayland) ist
    # dafuer verifiziert; ubuntu-latest ist inzwischen Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Dieses Repository auschecken
        uses: actions/checkout@v4

      - name: KiCad-Quelle mit Submodulen
        uses: actions/checkout@v4
        with:
          repository: KiCad/kicad-source-mirror
          ref: ${{ needs.resolve.outputs.tag }}
          path: kicad
          fetch-depth: 1
          submodules: recursive

      - name: Speicherplatz freimachen (KiCad-Build braucht viel)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                       /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Build-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl file \
            libboost-all-dev libcurl4-openssl-dev libssl-dev \
            libgl1-mesa-dev libglew-dev libglm-dev libegl1-mesa-dev \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libcairo2-dev libpixman-1-dev \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev wx3.2-headers \
            python3-dev python3-wxgtk4.0 swig \
            libngspice0-dev nlohmann-json3-dev libgit2-dev libsecret-1-dev \
            libprotobuf-dev protobuf-compiler libnng-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libzstd-dev libspnav-dev unixodbc-dev \
            libgtk-3-dev libpoppler-cpp-dev libpoppler-glib-dev \
            libwayland-dev libpng-dev \
            gettext pkg-config

      - name: xSignals-Patch anwenden
        run: python3 scripts/apply_xsignals.py --src kicad

      - name: CMake konfigurieren
        run: >
          cmake -S kicad -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKICAD_BUILD_QA_TESTS=OFF

      - name: Kompilieren (dauert 1-2 Stunden)
        run: cmake --build build -j "$(nproc)"

      - name: Artefakt packen
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ needs.resolve.outputs.tag }}"
          BIN=""
          [ -d build/bin ] && BIN=build/bin
          if [ -z "$BIN" ]; then
            KICAD_BIN=$(find build -maxdepth 3 -type f -name kicad -perm -u+x 2>/dev/null | head -1 || true)
            [ -n "$KICAD_BIN" ] && BIN=$(dirname "$KICAD_BIN")
          fi
          if [ -z "$BIN" ]; then
            echo "::error::Kein KiCad-Bin-Verzeichnis gefunden - build/ Inhalt:"
            ls -la build 2>/dev/null | head -12 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-170 | tr ',' ';' | tr '%' '#')"
            done
            exit 1
          fi
          echo "Bin-Verzeichnis: $BIN"
          ls -lh "$BIN" | head -12
          set +e
          tar -C "$BIN" -czf "dist/kicad-xsignals-$TAG-linux-x86_64.tar.gz" .
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::tar fehlgeschlagen (exit $rc) - Inhalt von $BIN:"
            ls -lh "$BIN" 2>/dev/null | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-170 | tr ',' ';' | tr '%' '#')"
            done
            exit $rc
          fi
          ls -lh dist/

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ needs.resolve.outputs.tag }}
          path: dist/
          retention-days: 90

  build-windows:
    name: Windows-Build (${{ needs.resolve.outputs.tag }})
    needs: [resolve, patch-check]
    if: needs.resolve.outputs.skip == 'false'
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Dieses Repository auschecken
        uses: actions/checkout@v4

      - name: KiCad-Quelle mit Submodulen
        uses: actions/checkout@v4
        with:
          repository: KiCad/kicad-source-mirror
          ref: ${{ needs.resolve.outputs.tag }}
          path: kicad
          fetch-depth: 1
          submodules: recursive

      # wxPython fehlt in MSYS2 (kein Paket) -> KICAD_SCRIPTING_WXPYTHON=OFF
      # Plugin laeuft im offiziellen KiCad; dieser Build stellt den xSignals-Tuner.
      - name: MSYS2 (UCRT64) einrichten
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make tar
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-nng
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-zstd

      - name: xSignals-Patch anwenden
        shell: msys2 {0}
        run: python3 scripts/apply_xsignals.py --src kicad

      - name: CMake konfigurieren
        shell: msys2 {0}
        run: >
          cmake -S kicad -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKICAD_BUILD_QA_TESTS=OFF
          -DKICAD_SCRIPTING_WXPYTHON=OFF
          -DOCC_INCLUDE_DIR=/ucrt64/include/opencascade
          -DCMAKE_INSTALL_PREFIX=$PWD/install

      - name: Kompilieren (dauert 2-4 Stunden)
        shell: msys2 {0}
        run: cmake --build build -j "$(nproc)"

      - name: Installieren
        shell: msys2 {0}
        run: |
          set +e
          cmake --install build > /tmp/install.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -10 /tmp/install.log | while IFS= read -r l; do
              echo "::error::Install: $(echo "$l" | cut -c1-170 | tr ',' ';' | tr '%' '#')"
            done
            exit 1
          fi
          tail -3 /tmp/install.log

      - name: Packen
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve.outputs.tag }}"
          if (-not (Test-Path "./install")) { Write-Error "install/ fehlt"; exit 1 }
          Rename-Item -Path "./install" -NewName "kicad-xsignals-$tag-windows-x86_64"
          7z a -tzip "kicad-xsignals-$tag-windows-x86_64.zip" "./kicad-xsignals-$tag-windows-x86_64"
          if (-not (Test-Path "kicad-xsignals-$tag-windows-x86_64.zip")) { Write-Error "ZIP fehlt"; exit 1 }
          Get-Item "kicad-xsignals-$tag-windows-x86_64.zip" | Select-Object Name, Length

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.resolve.outputs.tag }}
          path: kicad-xsignals-${{ needs.resolve.outputs.tag }}-windows-x86_64.zip
          retention-days: 90

  release:
    name: Release veröffentlichen
    needs: [resolve, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: SHA256-Prüfsummen
        working-directory: pkg
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kicad-xsignals-${{ needs.resolve.outputs.tag }}
          name: "KiCad ${{ needs.resolve.outputs.tag }} mit xSignals-Tuner"
          body: |
            Inoffizieller KiCad-Build mit xSignals-Patch
            (Tuner kennt xSignal-Gruppen, definiert über das
            xSignals-Plugin als Board-Property).

            Basis: KiCad ${{ needs.resolve.outputs.tag }}
            (Quelle: KiCad/kicad-source-mirror)

            Lizenzhinweis: KiCad steht unter GPLv3; dieser Build ist
            nicht mit dem KiCad-Projekt verbunden.
          files: |
            pkg/*
          fail_on_unmatched_files: true
